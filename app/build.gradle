plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minitech.miniworld'
    compileSdk 34

    // AppPlayNetwork / AppPlayUpdateLayout use org.apache.http (removed from the
    // platform in API 23); the legacy library ships with the Android SDK.
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "com.minitech.miniworld"
        // The original AndroidManifest.xml declared minSdkVersion 11 / targetSdkVersion 19.
        // 19 is used here because the modern Android Gradle Plugin / build-tools no longer
        // support building for API 11 (see docs/05_构建说明.md).
        minSdk 19
        targetSdk 19
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // The original APK was signed with the Android debug certificate. This keystore is
        // generated by tools/make_keystore.ps1 (same subject: CN=Android Debug, O=Local, C=US)
        // so a release build works without depending on ~/.android/debug.keystore.
        release {
            storeFile file('../keystore/restored.jks')
            storePassword 'android'
            keyAlias 'restored'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            // mirrors BuildConfig.DEBUG == true found in the original classes.dex
            minifyEnabled false
            // WARNING: this variant is android:debuggable="true", which makes ART turn on
            // CheckJNI. The original engine libAppPlayJNI.so contains a sloppy JNI call
            // (it invokes AppPlayBaseActivity.SetScreenBright(float) - a void method - via
            // CallStaticIntMethod), which CheckJNI turns into a fatal SIGABRT. A debug build
            // therefore crashes a fraction of a second after the GL thread starts.
            // Use assembleRelease (or see docs/07) to get a runnable APK.
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            // debuggable stays false (the AGP default for release): this is what keeps
            // CheckJNI off and lets the unmodified engine library run.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        jniLibs {
            // the game ships a 32-bit ARM engine (armeabi) and loads it manually
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            // 187 classes of the bundled support-v4 library are part of classes.dex,
            // so they are restored as ordinary sources instead of a Maven dependency.
            java.srcDirs = ['src/main/java']
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    // No external dependencies: everything that was inside classes.dex is restored as source.
}

// the restored sources contain UTF-8 Chinese string literals
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
